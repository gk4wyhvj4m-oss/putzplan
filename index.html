<style>
:root {
  --bg: #f5f4f0;
  --card: #ffffff;
  --ink: #1d211f;
  --ink-soft: #4b524e;
  --muted: #8c928d;
  --line: rgba(29, 33, 31, .08);
  --accent: #5d7d6c;
  --accent-soft: rgba(93, 125, 108, .11);
  --warn: #b0654a;
  --warn-soft: rgba(176, 101, 74, .1);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.035);
  --bar: rgba(245, 244, 240, .86);
  --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121413;
    --card: #1b1e1c;
    --ink: #e8ebe7;
    --ink-soft: #c2c8c3;
    --muted: #7f8781;
    --line: rgba(232, 235, 231, .08);
    --accent: #8db29d;
    --accent-soft: rgba(141, 178, 157, .13);
    --warn: #d58c70;
    --warn-soft: rgba(213, 140, 112, .12);
    --shadow: none;
    --bar: rgba(18, 20, 19, .84);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
@supports (overflow: clip) { html, body { overflow-x: clip; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); min-height: 100vh; }
button { font: inherit; color: inherit; }
.i { width: 22px; height: 22px; flex: none; display: block; }

main {
  max-width: 620px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 120px);
}

/* Kopf */
.hd-top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.date { font-size: 14px; color: var(--muted); font-weight: 500; }
.ib {
  appearance: none; border: 0; background: none; width: 40px; height: 40px; border-radius: 20px;
  display: grid; place-items: center; color: var(--ink-soft); cursor: pointer; margin-right: -8px;
}
.ib:active { background: var(--line); }
.back { margin-left: -10px; margin-right: 0; color: var(--accent); }
h1 { font-size: 34px; line-height: 1.1; margin: 4px 0 4px; font-weight: 700; letter-spacing: -.01em; }
.summary { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
.room-title { display: flex; align-items: center; gap: 12px; }

.seg {
  display: flex; background: var(--line); border-radius: 11px; padding: 2px; margin: 0 0 22px;
}
.seg button {
  appearance: none; border: 0; background: none; flex: 1; height: 32px; border-radius: 9px;
  font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  transition: background .2s, color .2s;
}
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* Abschnitte und Zeilen */
.sec { margin: 0 0 22px; }
.sec-h {
  font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--muted);
  margin: 0 4px 8px; display: flex; justify-content: space-between;
}
.sec-h.warn { color: var(--warn); }
.list { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 13px; padding: 12px 12px 12px 14px;
  position: relative; cursor: pointer;
  transition: opacity .35s ease, transform .35s ease;
}
.row + .row::before {
  content: ""; position: absolute; top: 0; left: 64px; right: 0; height: 1px; background: var(--line);
}
.row:active { background: var(--line); }
.row.gone { opacity: 0; transform: translateX(24px); }
.tile {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.tile .i { width: 20px; height: 20px; }
.tile.lg { width: 52px; height: 52px; border-radius: 15px; }
.tile.lg .i { width: 26px; height: 26px; }
.tile.warn { background: var(--warn-soft); color: var(--warn); }
.txt { flex: 1; min-width: 0; }
.nm { font-size: 16px; font-weight: 600; line-height: 1.25; }
.meta { display: flex; gap: 10px; font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .due.warn { color: var(--warn); font-weight: 600; }
.meta .due.today { color: var(--accent); font-weight: 600; }
.fresh { height: 3px; border-radius: 2px; background: var(--line); margin-top: 7px; overflow: hidden; }
.fresh i { display: block; height: 100%; background: var(--accent); opacity: .55; border-radius: 2px; }
.chk {
  appearance: none; border: 1.6px solid var(--line); background: none; flex: none;
  width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center;
  color: transparent; cursor: pointer; transition: all .25s ease;
  border-color: color-mix(in srgb, var(--muted) 45%, transparent);
}
.chk .i { width: 18px; height: 18px; }
.chk.done { background: var(--accent); border-color: var(--accent); color: var(--card); transform: scale(1.05); }
.more {
  appearance: none; border: 0; background: none; width: 100%; padding: 14px; font-size: 15px;
  color: var(--accent); font-weight: 600; cursor: pointer;
}
.add-row { color: var(--accent); }
.add-row .tile { background: none; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent); }

.empty { text-align: center; padding: 34px 20px 30px; color: var(--muted); }
.empty .tile { margin: 0 auto 14px; width: 56px; height: 56px; border-radius: 18px; }
.empty .tile .i { width: 28px; height: 28px; }
.empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

/* Zimmer-Karten */
.rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rc {
  appearance: none; border: 0; text-align: left; cursor: pointer;
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px;
  display: flex; flex-direction: column; gap: 12px; min-height: 128px;
}
.rc:active { transform: scale(.98); }
.rc .nm { font-size: 16px; }
.rc .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.rc .sub.warn { color: var(--warn); font-weight: 600; }
.rc .fresh { margin-top: auto; }

/* Plus-Knopf */
.fab {
  position: fixed; right: max(18px, calc(50% - 292px)); bottom: calc(env(safe-area-inset-bottom) + 22px); z-index: 5;
  width: 56px; height: 56px; border-radius: 28px; border: 0;
  background: var(--accent); color: var(--card); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
}
.fab .i { width: 26px; height: 26px; }
.fab:active { transform: scale(.95); }

/* Blätter */
.veil { position: fixed; inset: 0; z-index: 9; background: rgba(10,12,11,.28); opacity: 0; pointer-events: none; transition: opacity .28s ease; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 620px; margin: 0 auto;
  background: var(--bg); border-radius: 24px 24px 0 0;
  padding: 10px 18px calc(env(safe-area-inset-bottom) + 22px);
  max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  transform: translateY(104%); transition: transform .34s cubic-bezier(.2,.8,.2,1);
}
.sheet-open .veil { opacity: 1; pointer-events: auto; }
.sheet-open .sheet { transform: none; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
.sh-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.sh-head h2 { margin: 0; font-size: 22px; line-height: 1.2; }
.sh-head .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
h2.t { font-size: 22px; margin: 0 0 18px; }
.facts { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
.facts div { display: flex; justify-content: space-between; gap: 14px; padding: 12px 14px; font-size: 15px; }
.facts div + div { border-top: 1px solid var(--line); }
.facts span { color: var(--muted); }
.facts b { font-weight: 600; text-align: right; }
.btn {
  appearance: none; border: 0; cursor: pointer; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 50px; border-radius: 14px; font-size: 16px; font-weight: 600;
  background: var(--card); color: var(--ink); box-shadow: var(--shadow);
}
.btn:active { opacity: .8; }
.btn.pri { background: var(--accent); color: var(--card); box-shadow: none; }
.btn.danger { background: none; box-shadow: none; color: var(--warn); }
.btn .i { width: 19px; height: 19px; }
.btn input[type=date] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
.btn-row { display: flex; gap: 10px; margin-top: 10px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--muted); margin: 20px 4px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none; border: 0; cursor: pointer; height: 38px; padding: 0 14px; border-radius: 19px;
  background: var(--card); box-shadow: var(--shadow); font-size: 15px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px; color: var(--ink-soft);
}
.chip .i { width: 17px; height: 17px; }
.chip.on { background: var(--accent); color: var(--card); box-shadow: none; }
.hist { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
.hist div { padding: 11px 14px; font-size: 15px; color: var(--ink-soft); display: flex; justify-content: space-between; }
.hist div + div { border-top: 1px solid var(--line); }
.hist span { color: var(--muted); }

.fld { display: block; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 9px 14px 10px; margin-bottom: 4px; }
.fld span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
.fld input {
  appearance: none; border: 0; background: none; width: 100%; font: inherit; font-size: 17px;
  color: var(--ink); padding: 3px 0 0; outline: none; min-height: 26px;
}
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.icons button {
  appearance: none; border: 0; cursor: pointer; aspect-ratio: 1; border-radius: 13px;
  background: var(--card); box-shadow: var(--shadow); color: var(--ink-soft); display: grid; place-items: center;
}
.icons button.on { background: var(--accent); color: var(--card); box-shadow: none; }
.name-row { display: flex; gap: 10px; align-items: stretch; }
.name-row .tile.lg { width: 60px; height: auto; min-height: 60px; border-radius: 14px; }
.name-row .fld { flex: 1; margin: 0; }
.fld.search { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 42px; margin-bottom: 6px; }
.fld.search .i { width: 18px; height: 18px; color: var(--muted); }
.fld.search input { padding: 0; font-size: 16px; }
.icat { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 4px 8px; letter-spacing: .02em; }
.interval { display: flex; gap: 10px; align-items: center; }
.stepper { display: flex; align-items: center; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); height: 46px; }
.stepper button { appearance: none; border: 0; background: none; width: 44px; height: 46px; font-size: 22px; color: var(--accent); cursor: pointer; }
.stepper b { min-width: 30px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.interval .seg { flex: 1; margin: 0; height: 46px; align-items: stretch; border-radius: 14px; }
.interval .seg button { height: auto; border-radius: 12px; }
.mode-seg { margin: 0; }
.hint { font-size: 13.5px; color: var(--muted); margin: 8px 4px 0; line-height: 1.4; }
.set-list { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.set-list button {
  appearance: none; border: 0; background: none; width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; font-size: 16px; cursor: pointer; text-align: left; color: var(--ink);
}
.set-list button + button { border-top: 1px solid var(--line); }
.set-list .tile { width: 32px; height: 32px; border-radius: 9px; }
.set-list .tile .i { width: 17px; height: 17px; }
.set-list .grow { flex: 1; }
.set-list .cnt { color: var(--muted); font-size: 14px; }
.set-list .chev { color: var(--muted); width: 18px; height: 18px; }
.set-list .acc { color: var(--accent); font-weight: 600; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }

/* Hinweis unten */
.toast {
  position: fixed; left: 18px; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 92px); z-index: 8;
  max-width: 520px; margin: 0 auto;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 8px 12px 16px;
  display: flex; align-items: center; gap: 10px; font-size: 14.5px;
  transform: translateY(20px); opacity: 0; pointer-events: none; transition: all .3s ease;
}
.toast.show { transform: none; opacity: 1; pointer-events: auto; }
.toast span { flex: 1; }
.toast button { appearance: none; border: 0; background: none; color: var(--accent); font-weight: 700; padding: 6px 10px; cursor: pointer; filter: brightness(1.25); }
@media (prefers-color-scheme: dark) { .toast button { filter: none; color: #456a56; } }
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Neue Aufgabe"></button>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Rückgängig</button></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

const KEY = 'putzplan.v1';

/* ---------- Hilfen ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const svg = n => '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[n] || ICONS.sparkles) + '</svg>';
const uid = () => Math.random().toString(36).slice(2, 10);

const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
function addInt(s, every, unit) {
  const d = parse(s);
  if (unit === 'd') d.setDate(d.getDate() + every);
  else if (unit === 'w') d.setDate(d.getDate() + 7 * every);
  else {
    const day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + every);
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
  }
  return iso(d);
}
const intDays = t => t.unit === 'd' ? t.every : t.unit === 'w' ? t.every * 7 : t.every * 30;

const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MO = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MOS = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'];
const fmtLong = s => { const d = parse(s); return WD[d.getDay()] + ', ' + d.getDate() + '. ' + MO[d.getMonth()]; };
const fmt = s => { const d = parse(s); const y = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''; return d.getDate() + '. ' + MOS[d.getMonth()] + y; };

function dueText(t) {
  const d = diff(today(), t.due);
  if (d < 0) return 'überfällig seit ' + (-d) + (d === -1 ? ' Tag' : ' Tagen');
  if (d === 0) return 'heute';
  if (d === 1) return 'morgen';
  if (d < 7) return 'in ' + d + ' Tagen';
  return 'am ' + fmt(t.due);
}
const dueCls = t => { const d = diff(today(), t.due); return d < 0 ? 'warn' : d === 0 ? 'today' : ''; };
function freshness(t) {
  const last = t.last || addInt(t.due, -t.every, t.unit);
  const span = Math.max(1, diff(last, t.due));
  const left = diff(today(), t.due);
  return Math.max(0, Math.min(1, left / span));
}
function rhythmText(t) {
  const n = t.every;
  const base = t.unit === 'd' ? (n === 1 ? 'Täglich' : 'Alle ' + n + ' Tage')
    : t.unit === 'w' ? (n === 1 ? 'Jede Woche' : 'Alle ' + n + ' Wochen')
    : (n === 1 ? 'Jeden Monat' : 'Alle ' + n + ' Monate');
  return base + (t.mode === 'fixed' ? ', fester Rhythmus' : ', ab Erledigung');
}

/* ---------- Daten ---------- */

    ['Heizkörper entstauben', 'heizkoerper', 1, 'm']]],
];
function seed() {
  const t0 = today(); const S = { rooms: [], tasks: [] };
  let k = 0;
  SEED.forEach(([rn, ri, tasks]) => {
    const r = { id: uid(), name: rn, icon: ri }; S.rooms.push(r);
    tasks.forEach(([n, ic, every, unit, mode]) => {
      const t = { id: uid(), name: n, room: r.id, icon: ic, every, unit, mode: mode || 'flex', hist: [] };
      const span = intDays(t);
      let off = 1 + (k * 5) % Math.min(span, 14);
      if (k % 8 === 0) off = 0;
      if (k === 4 || k === 15) off = -2;
      t.due = addDays(t0, off);
      t.last = addInt(t.due, -every, unit);
      S.tasks.push(t); k++;
    });
  });
  return S;
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.rooms && s.tasks) {
      s.tasks.forEach(t => { if (t.icon === 'app-window') t.icon = 'fenster'; });
      return s;
    }
  } catch (e) {}
  return null;
}
let S = load() || seed();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
save();
const room = id => S.rooms.find(r => r.id === id) || { name: 'Ohne Zimmer', icon: 'house' };
const task = id => S.tasks.find(t => t.id === id);

function complete(t, date) {
  const prev = JSON.parse(JSON.stringify(t));
  if (t.mode === 'fixed') {
    let next = addInt(t.due, t.every, t.unit);
    while (next <= date) next = addInt(next, t.every, t.unit);
    t.due = next;
  } else {
    t.due = addInt(date, t.every, t.unit);
  }
  t.last = date;
  t.hist = [date].concat(t.hist || []).slice(0, 30);
  save();
  return prev;
}
function restore(prev) {
  const i = S.tasks.findIndex(x => x.id === prev.id);
  if (i >= 0) S.tasks[i] = prev; save();
}

/* ---------- Ansicht ---------- */
let view = 'due';           // 'due' | 'rooms' | 'room'
let curRoom = null;
let showLater = false;
try { const v = localStorage.getItem(KEY + '.view'); if (v === 'rooms') view = v; } catch (e) {}

function row(t, showRoom) {
  const f = Math.round(freshness(t) * 100);
  const cls = dueCls(t);
  return '<div class="row" data-id="' + t.id + '">' +
    '<div class="tile' + (cls === 'warn' ? ' warn' : '') + '">' + svg(t.icon) + '</div>' +
    '<div class="txt"><div class="nm">' + esc(t.name) + '</div>' +
    '<div class="meta">' + (showRoom ? '<span>' + esc(room(t.room).name) + '</span>' : '') +
    '<span class="due ' + cls + '">' + dueText(t) + '</span></div>' +
    '<div class="fresh"><i style="width:' + f + '%"></i></div></div>' +
    '<button class="chk" aria-label="Erledigt">' + svg('check') + '</button></div>';
}
const sortDue = (a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : a.name.localeCompare(b.name);

function header(title, extra) {
  return '<div class="hd-top"><span class="date">' + fmtLong(today()) + '</span>' +
    '<button class="ib" data-act="settings" aria-label="Einstellungen">' + svg('settings-2') + '</button></div>' +
    '<h1>' + title + '</h1>' + (extra || '') +
    '<div class="seg"><button data-view="due" class="' + (view === 'due' ? 'on' : '') + '">Anstehend</button>' +
    '<button data-view="rooms" class="' + (view === 'rooms' ? 'on' : '') + '">Zimmer</button></div>';
}

function render() {
  const t0 = today();
  const app = $('app');
  if (view === 'room') return renderRoom();
  const tasks = S.tasks.slice().sort(sortDue);
  const over = tasks.filter(t => t.due < t0);
  const now = tasks.filter(t => t.due === t0);
  const open = over.length + now.length;
  const summary = '<p class="summary">' + (open ? (open === 1 ? 'Eine Aufgabe steht an' : open + ' Aufgaben stehen an') : 'Für heute ist alles erledigt') + '</p>';
  if (view === 'due') {
    const soon = tasks.filter(t => t.due > t0 && diff(t0, t.due) <= 7);
    const later = tasks.filter(t => diff(t0, t.due) > 7);
    let h = header('Heute', summary);
    if (!open) h += '<div class="empty"><div class="tile">' + svg('sparkles') + '</div><b>Alles sauber</b>Nichts steht heute an.</div>';
    if (over.length) h += sec('Überfällig', over, true, 'warn');
    if (now.length) h += sec('Heute', now, true);
    if (soon.length) h += sec('Nächste 7 Tage', soon, true);
    if (later.length) {
      h += '<div class="sec"><div class="sec-h"><span>Später</span><span>' + later.length + '</span></div><div class="list">' +
        (showLater ? later.map(t => row(t, true)).join('') : '') +
        '<button class="more" data-act="later">' + (showLater ? 'Weniger anzeigen' : 'Alle anzeigen') + '</button></div></div>';
    }
    app.innerHTML = h;
  } else {
    let h = header('Zimmer', summary) + '<div class="rooms">';
    S.rooms.forEach(r => {
      const ts = S.tasks.filter(t => t.room === r.id);
      const due = ts.filter(t => t.due <= t0).length;
      const f = ts.length ? Math.round(ts.reduce((a, t) => a + freshness(t), 0) / ts.length * 100) : 100;
      h += '<button class="rc" data-room="' + r.id + '"><div class="tile">' + svg(r.icon) + '</div>' +
        '<div><div class="nm">' + esc(r.name) + '</div><div class="sub' + (due ? ' warn' : '') + '">' +
        (due ? due + ' fällig' : ts.length ? 'alles erledigt' : 'keine Aufgaben') + '</div></div>' +
        '<div class="fresh"><i style="width:' + f + '%"></i></div></button>';
    });
    h += '</div>';
    app.innerHTML = h;
  }
}
function sec(title, list, showRoom, cls) {
  return '<div class="sec"><div class="sec-h ' + (cls || '') + '"><span>' + title + '</span><span>' + list.length + '</span></div>' +
    '<div class="list">' + list.map(t => row(t, showRoom)).join('') + '</div></div>';
}
function renderRoom() {
  const r = room(curRoom);

}

/* ---------- Abhaken ---------- */
let toastTimer = null, undoPrev = null;
function toast(text, prev) {
  undoPrev = prev;
  $('toastText').textContent = text;
  $('toastUndo').style.display = prev ? '' : 'none';
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4200);
}
$('toastUndo').addEventListener('click', () => {
  if (undoPrev) { restore(undoPrev); undoPrev = null; render(); }
  $('toast').classList.remove('show');
});
function doComplete(id, date, rowEl) {
  const t = task(id); if (!t) return;
  const prev = complete(t, date);
  toast('Erledigt. Wieder fällig am ' + fmt(t.due), prev);
  if (rowEl) {
    rowEl.querySelector('.chk').classList.add('done');
    setTimeout(() => rowEl.classList.add('gone'), 260);
    setTimeout(render, 600);
  } else render();
}

/* ---------- Blätter ---------- */
const sheet = $('sheet');
function openSheet(html) {
  sheet.innerHTML = '<div class="grab"></div>' + html;
  sheet.scrollTop = 0;
  document.body.classList.add('sheet-open');
}
function closeSheet() { document.body.classList.remove('sheet-open'); sheet.style.transform = ''; }
$('veil').addEventListener('click', closeSheet);
let sy = null;
sheet.addEventListener('touchstart', e => { sy = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
sheet.addEventListener('touchmove', e => {
  if (sy === null) return; const d = e.touches[0].clientY - sy;
  if (d > 0) { sheet.style.transition = 'none'; sheet.style.transform = 'translateY(' + d + 'px)'; }
}, { passive: true });
sheet.addEventListener('touchend', e => {
  if (sy === null) return; const d = e.changedTouches[0].clientY - sy; sy = null;
  sheet.style.transition = ''; if (d > 90) closeSheet(); else sheet.style.transform = '';
});

function openDetail(id) {

const ALL = [];
CATS.forEach(([c, list]) => list.forEach(([n, label, kw]) => ALL.push({ n, label, cat: c, kw: (label + ',' + kw).toLowerCase().split(',').map(x => x.trim()).filter(x => x.length > 2) })));
function guessIcon(name) {
  const s = name.toLowerCase(); let best = null, len = 0;
  ALL.forEach(e => e.kw.forEach(w => { if (w.length > len && s.includes(w)) { best = e.n; len = w.length; } }));
  return best;
}
function iconGrid(q) {
  const btn = e => '<button data-i="' + e.n + '" class="' + (F.icon === e.n ? 'on' : '') + '" aria-label="' + esc(e.label) + '">' + svg(e.n) + '</button>';
  q = (q || '').trim().toLowerCase();
  if (q) {
    const hits = ALL.filter(e => e.kw.some(w => w.includes(q)) || e.label.toLowerCase().includes(q));
    return hits.length ? '<div class="icons">' + hits.map(btn).join('') + '</div>' : '<p class="hint">Kein passendes Symbol gefunden.</p>';
  }
  return CATS.map(([c]) => '<div class="icat">' + c + '</div><div class="icons">' + ALL.filter(e => e.cat === c).map(btn).join('') + '</div>').join('');
}

    '<h2 class="t">Einstellungen</h2>' +
    '<div class="lbl" style="margin-top:0">Zimmer</div><div class="set-list">' +
    S.rooms.map(r => '<button data-editroom="' + r.id + '"><span class="tile">' + svg(r.icon) + '</span><span class="grow">' + esc(r.name) + '</span>' +
      '<span class="cnt">' + S.tasks.filter(t => t.room === r.id).length + '</span>' + svg('chevron-right').replace('class="i"', 'class="i chev"') + '</button>').join('') +
    '<button data-act="newRoom"><span class="tile">' + svg('plus') + '</span><span class="grow acc">Zimmer hinzufügen</span></button></div>' +
    '<div class="lbl">Sicherung</div><div class="set-list">' +
    '<button data-act="export"><span class="tile">' + svg('download') + '</span><span class="grow">Daten sichern</span></button>' +
    '<button data-act="import"><span class="tile">' + svg('upload') + '</span><span class="grow">Sicherung laden</span></button></div>' +
    '<div class="lbl">Neu beginnen</div><div class="set-list">' +
    '<button data-act="reset"><span class="tile">' + svg('rotate-ccw') + '</span><span class="grow">Mit Beispielen neu starten</span></button></div>' +
    '<p class="foot">Alle Daten liegen nur auf diesem Gerät.</p>'
  );
  sheet.dataset.form = 'settings';
}

/* ---------- Klicks ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button, .row, .rc, [data-act]');
  if (!el) return;

  // Hauptansicht
  if (el.dataset.view) { view = el.dataset.view; try { localStorage.setItem(KEY + '.view', view); } catch (x) {} render(); return; }
  if (el.dataset.room) { view = 'room'; curRoom = el.dataset.room; render(); window.scrollTo(0, 0); return; }
  if (el.classList.contains('chk')) {
    e.stopPropagation(); const r = el.closest('.row'); doComplete(r.dataset.id, today(), r); return;
  }
  if (el.classList.contains('row') && el.dataset.id) { openDetail(el.dataset.id); return; }

  // Formular Aufgabe
  if (el.dataset.r) { F.room = el.dataset.r; sheet.querySelectorAll('#fRoom .chip').forEach(b => b.classList.toggle('on', b.dataset.r === F.room));
    if (!F.iconManual && !guessIcon(F.name)) { F.icon = room(F.room).icon; markIcon(); } return; }
  if (el.dataset.step) { F.every = Math.max(1, Math.min(99, F.every + +el.dataset.step)); $('fEvery').textContent = F.every; return; }
  if (el.dataset.u) { F.unit = el.dataset.u; sheet.querySelectorAll('#fUnit button').forEach(b => b.classList.toggle('on', b.dataset.u === F.unit)); return; }
  if (el.dataset.m) { F.mode = el.dataset.m; sheet.querySelectorAll('#fMode button').forEach(b => b.classList.toggle('on', b.dataset.m === F.mode)); $('fHint').textContent = modeHint(); return; }
  if (el.dataset.i) { F.icon = el.dataset.i; F.iconManual = true; markIcon(); return; }
  if (el.dataset.ri) { RF.icon = el.dataset.ri; sheet.querySelectorAll('#rIcon button').forEach(b => b.classList.toggle('on', b.dataset.ri === RF.icon)); return; }
  if (el.dataset.post) {
    const t = task(sheet.dataset.id); const prev = JSON.parse(JSON.stringify(t));
    const base = t.due < today() ? today() : t.due; t.due = addDays(base, +el.dataset.post); save();
    closeSheet(); render(); toast('Verschoben auf ' + fmt(t.due), prev); return;
  }
  if (el.dataset.editroom) { openRoomEdit(el.dataset.editroom); return; }

  const act = el.dataset.act;
  if (!act) return;
  if (act === 'settings') openSettings();
  else if (act === 'back') { view = 'rooms'; render(); }
  else if (act === 'later') { showLater = !showLater; render(); }
  else if (act === 'new') openEdit(null, view === 'room' ? curRoom : null);
  else if (act === 'editRoom') openRoomEdit(curRoom);
  else if (act === 'doneToday') { const id = sheet.dataset.id; closeSheet(); doComplete(id, today()); }
  else if (act === 'doneYesterday') { const id = sheet.dataset.id; closeSheet(); doComplete(id, addDays(today(), -1)); }
  else if (act === 'edit') openEdit(sheet.dataset.id);
  else if (act === 'saveTask') {
    F.name = $('fName').value.trim();
    if (!F.name) { $('fName').focus(); return; }
    const data = { name: F.name, room: F.room, icon: F.icon, every: F.every, unit: F.unit, mode: F.mode, due: F.due };
    if (F.id) Object.assign(task(F.id), data);
    else S.tasks.push({ id: uid(), ...data, last: null, hist: [] });
    save(); closeSheet(); render();
  }
  else if (act === 'delTask') {
    if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Wirklich löschen?'; return; }
    S.tasks = S.tasks.filter(t => t.id !== F.id); save(); closeSheet(); render();
  }
  else if (act === 'newRoom') openRoomEdit(null);
  else if (act === 'saveRoom') {
    RF.name = $('rName').value.trim(); if (!RF.name) { $('rName').focus(); return; }
    if (RF.id) Object.assign(S.rooms.find(r => r.id === RF.id), { name: RF.name, icon: RF.icon });
    else S.rooms.push({ id: uid(), name: RF.name, icon: RF.icon });
    save(); closeSheet(); render();
  }
  else if (act === 'delRoom') {
    const n = +el.dataset.n;
    if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = n ? 'Löschen, samt ' + (n === 1 ? 'einer Aufgabe' : n + ' Aufgaben') + '?' : 'Wirklich löschen?'; return; }
    S.rooms = S.rooms.filter(r => r.id !== RF.id); S.tasks = S.tasks.filter(t => t.room !== RF.id);
    save(); closeSheet(); if (view === 'room') view = 'rooms'; render();
  }
  else if (act === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'putzplan-' + today() + '.json'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  else if (act === 'import') $('importFile').click();
  else if (act === 'reset') {
    if (!el.dataset.sure) { el.dataset.sure = '1'; el.querySelector('.grow').textContent = 'Wirklich alles ersetzen?'; return; }
    S = seed(); save(); closeSheet(); view = 'due'; render();
  }
});
$('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const s = JSON.parse(rd.result); if (!s.rooms || !s.tasks) throw 0; S = s; save(); closeSheet(); render(); toast('Sicherung geladen.'); }
    catch (x) { toast('Diese Datei ist keine Putzplan-Sicherung.'); }
  };
  rd.readAsText(f); e.target.value = '';
});
$('fab').innerHTML = svg('plus');
$('fab').addEventListener('click', () => openEdit(null, view === 'room' ? curRoom : null));

/* neuer Tag, App wieder geöffnet */
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);

render();
</script>
</body>
</html>
